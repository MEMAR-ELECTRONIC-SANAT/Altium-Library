  <title id="title">Altium Library — MES</title>
  <desc id="desc">کتابخانه آلتیوم شامل بیش از ۵۰۰۰ قطعه، فوت‌پرینت‌های مطابق با استاندارد IPC و مدل‌های سه‌بعدی با فرمت STEP. Altium Library with over 5000 components, IPC compliant footprints, including 3D STEP models.</desc>
